global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "demo-app"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["demo-app:8080"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
