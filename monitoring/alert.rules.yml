groups:
  - name: demo-app.rules
    rules:
      - alert: DemoAppDown
        expr: up{job="demo-app"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "demo-app is down"
          description: "Prometheus has not been able to scrape demo-app for 2 minutes."

      - alert: DemoAppHighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="demo-app", status=~"5.."}[5m]))
          /
          sum(rate(http_server_requests_seconds_count{job="demo-app"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "demo-app 5xx rate above 5%"
          description: "Error rate has exceeded 5% for the last 5 minutes."

      - alert: DemoAppHighHeapUsage
        expr: |
          jvm_memory_used_bytes{job="demo-app", area="heap"}
          / jvm_memory_max_bytes{job="demo-app", area="heap"} > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "demo-app JVM heap near capacity"
          description: "Heap usage has been above 90% of max for 5 minutes."
