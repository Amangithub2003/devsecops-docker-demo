input {
  beats {
    port => 5044
  }
}

filter {
  # Spring Boot logs are plain text by default; if you switch to JSON logging,
  # add: json { source => "message" }
  if [container][name] == "demo-app" {
    mutate {
      add_field => { "service" => "demo-app" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "demo-app-logs-%{+YYYY.MM.dd}"
  }
}
